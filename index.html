<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>境瞳科技 Renlab · 客户介绍主 Deck v2（动态科技版）</title>
<style>
:root{
  --bg:#04060c; --ink:#eef3ff; --sub:#a6b6d8;
  --accent:#5b8cff; --accent2:#9a6cff; --cyan:#25e6ff; --gold:#ffd27a; --green:#43e58a; --red:#ff6b7a;
  --line:rgba(130,160,230,.22); --card:rgba(255,255,255,.045);
  --mono:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
  --sans:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
#net{position:fixed;inset:0;z-index:0;display:block}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 70% 60% at 50% 42%,transparent 30%,rgba(4,6,12,.72) 100%)}
.aurora{position:fixed;inset:0;z-index:1;pointer-events:none;mix-blend-mode:screen;opacity:.6}
.aurora span{position:absolute;border-radius:50%;filter:blur(90px);animation:drift 22s ease-in-out infinite}
.aurora .s1{width:560px;height:560px;background:radial-gradient(circle,#2b52ffaa,transparent 70%);top:-140px;left:-100px}
.aurora .s2{width:520px;height:520px;background:radial-gradient(circle,#8a3cffaa,transparent 70%);bottom:-160px;right:-80px;animation-delay:-7s}
.aurora .s3{width:420px;height:420px;background:radial-gradient(circle,#14d9ff88,transparent 70%);top:45%;left:60%;animation-delay:-13s}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-40px) scale(1.12)}}

#stage{position:fixed;inset:0;z-index:3;display:flex;align-items:center;justify-content:center}
.slide{position:absolute;width:min(1200px,94vw);height:min(690px,92vh);
  background:linear-gradient(155deg,rgba(18,25,48,.55),rgba(6,9,20,.5));
  border:1px solid var(--line);border-radius:26px;padding:48px 58px;
  box-shadow:0 50px 140px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08);
  opacity:0;transform:translateY(46px) scale(.975) rotateX(4deg);pointer-events:none;transform-origin:center bottom;
  transition:opacity .7s cubic-bezier(.19,.7,.2,1),transform .7s cubic-bezier(.19,.7,.2,1);
  display:flex;flex-direction:column;justify-content:center;gap:6px;overflow:hidden;
  backdrop-filter:blur(7px) saturate(130%);-webkit-backdrop-filter:blur(7px) saturate(130%)}
.slide::before{content:"";position:absolute;inset:0;border-radius:26px;padding:1px;pointer-events:none;
  background:linear-gradient(140deg,rgba(91,140,255,.5),transparent 40%,transparent 60%,rgba(154,108,255,.4));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.8}
.slide::after{content:"";position:absolute;top:-40%;left:-30%;width:80%;height:180%;pointer-events:none;
  background:linear-gradient(115deg,transparent,rgba(255,255,255,.06),transparent);transform:rotate(8deg);opacity:0}
.slide.active{opacity:1;transform:translateY(0) scale(1) rotateX(0)}
.slide.active::after{animation:sheen 1.4s .3s ease-out}
@keyframes sheen{0%{left:-40%;opacity:0}20%{opacity:1}100%{left:120%;opacity:0}}
.slide.exit-up{opacity:0;transform:translateY(-40px) scale(.975) rotateX(-4deg)}
.slide>*{position:relative;z-index:2}

.kicker{font-family:var(--mono);font-size:13px;letter-spacing:.24em;color:var(--cyan);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:10px;text-shadow:0 0 18px rgba(37,230,255,.5)}
.kicker::before{content:"";width:28px;height:2px;background:linear-gradient(90deg,var(--cyan),transparent);border-radius:2px}
.pageno{position:absolute;top:44px;right:56px;font-family:var(--mono);font-size:60px;font-weight:800;color:rgba(120,150,230,.12);z-index:1;line-height:1}
h1{font-size:54px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin-bottom:14px;
  background:linear-gradient(120deg,#fff 15%,#a9c2ff 55%,#d7c4ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 30px rgba(120,140,255,.35))}
h2{font-size:36px;line-height:1.15;font-weight:800;letter-spacing:-.01em;margin-bottom:18px}
h2 .hl{background:linear-gradient(120deg,var(--cyan),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(120,140,255,.5))}
.lead{font-size:19px;line-height:1.7;color:#c3d0ee;max-width:64ch}
.lead b{color:#fff}
.sm{font-size:15px;line-height:1.6;color:var(--sub)}
.quote{margin-top:18px;font-size:18px;line-height:1.6;color:var(--ink);border-left:3px solid var(--gold);padding:14px 20px;
  background:linear-gradient(90deg,rgba(255,210,122,.1),rgba(255,210,122,.02));border-radius:0 14px 14px 0}
ul.feat{list-style:none;display:flex;flex-direction:column;gap:14px;margin-top:4px}
ul.feat li{font-size:19px;line-height:1.5;color:var(--ink);padding-left:34px;position:relative}
ul.feat li::before{content:"";position:absolute;left:0;top:8px;width:15px;height:15px;border-radius:5px;background:linear-gradient(135deg,var(--cyan),var(--accent2));box-shadow:0 0 18px rgba(91,140,255,.9);transform:rotate(45deg)}
ul.feat li b{color:#fff}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:6px}
.card{background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:18px;padding:22px 20px;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);transition:transform .4s cubic-bezier(.2,.7,.2,1),border-color .4s,box-shadow .4s;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(120px 80px at 50% 0%,rgba(91,140,255,.18),transparent 70%);opacity:0;transition:.4s}
.slide.active .card:hover{transform:translateY(-8px);border-color:var(--accent);box-shadow:0 20px 50px rgba(20,40,120,.5)}
.slide.active .card:hover::before{opacity:1}
.card .num-ic{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--cyan);margin-bottom:10px;text-shadow:0 0 16px rgba(37,230,255,.5)}
.card .ic{font-size:28px;margin-bottom:10px;filter:drop-shadow(0 0 14px rgba(120,160,255,.5))}
.card h3{font-size:19px;margin-bottom:8px;color:#fff}
.card p{font-size:14px;line-height:1.55;color:var(--sub)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;flex:1;align-content:center}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:10px}
.metric{background:linear-gradient(160deg,rgba(67,229,138,.1),rgba(255,255,255,.02));border:1px solid rgba(67,229,138,.3);border-radius:18px;padding:22px;text-align:center}
.metric .num{font-family:var(--mono);font-size:40px;font-weight:700;background:linear-gradient(120deg,var(--green),#b6ffd8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(67,229,138,.5))}
.metric .lab{font-size:13px;color:var(--sub);margin-top:6px;line-height:1.4}
.tag{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:13px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:7px 14px;margin:4px 8px 4px 0;background:rgba(255,255,255,.03)}
.tag b{color:var(--cyan)}
table.road{width:100%;border-collapse:separate;border-spacing:0;margin-top:4px;font-size:13px;border-radius:14px;overflow:hidden}
table.road th,table.road td{border:1px solid var(--line);padding:15px 14px;text-align:left;vertical-align:top;line-height:1.55}
table.road th{background:linear-gradient(180deg,rgba(91,140,255,.18),rgba(91,140,255,.06));font-weight:700;color:#fff;font-size:14px}
table.road td{background:rgba(10,14,28,.5)}
table.road td:first-child,table.road th:first-child{color:var(--sub);width:96px;font-weight:600;background:rgba(255,255,255,.03)}
.road .l1{color:var(--green)} .road .l2{color:var(--cyan)} .road .l3{color:var(--gold)}
.stage-row{display:flex;flex-direction:column;gap:12px;margin-top:2px}
.stage-item{display:flex;gap:16px;align-items:flex-start;background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:16px;padding:16px 20px;transition:.35s}
.slide.active .stage-item:hover{border-color:var(--accent);transform:translateX(6px)}
.stage-item .em{font-size:24px;filter:drop-shadow(0 0 12px rgba(120,160,255,.5))}
.stage-item .tx{font-size:15px;line-height:1.55;color:var(--ink)} .stage-item .tx b{color:#fff}
.steps{display:flex;gap:14px;margin-top:12px;align-items:stretch}
.step{flex:1;position:relative;padding:22px 20px;background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:16px;transition:.4s}
.slide.active .step:hover{transform:translateY(-6px);border-color:var(--cyan)}
.step .n{font-family:var(--mono);color:var(--cyan);font-size:14px;margin-bottom:8px}
.step h4{font-size:17px;margin-bottom:6px;color:#fff} .step p{font-size:14px;color:var(--sub);line-height:1.5}
.warn{color:var(--gold);font-size:13px;font-family:var(--mono)}
.big-final{font-size:48px;font-weight:800;line-height:1.18;background:linear-gradient(120deg,#fff,#a9c2ff,#d7c4ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 30px rgba(120,140,255,.4))}
.center{align-items:center;text-align:center;justify-content:center}
.center .lead{margin-left:auto;margin-right:auto;color:#cdd8f5}
.dot-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.pill{background:linear-gradient(160deg,rgba(91,140,255,.16),rgba(154,108,255,.08));border:1px solid rgba(130,160,230,.45);border-radius:12px;padding:10px 16px;font-size:15px;color:#eef3ff}
/* proofcast console */
.console{background:linear-gradient(160deg,rgba(10,16,34,.85),rgba(6,10,22,.8));border:1px solid rgba(37,230,255,.3);border-radius:16px;padding:20px 22px;box-shadow:0 0 40px rgba(37,230,255,.08),inset 0 0 40px rgba(37,230,255,.04)}
.console .bar{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;color:var(--cyan);margin-bottom:14px;border-bottom:1px solid rgba(37,230,255,.15);padding-bottom:10px}
.console .status{color:var(--green);display:flex;align-items:center;gap:6px}
.console .status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
.prog{height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:6px 0 16px}
.prog i{display:block;height:100%;width:98%;background:linear-gradient(90deg,var(--cyan),var(--accent));border-radius:6px;box-shadow:0 0 14px rgba(37,230,255,.6)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kpi{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.kpi .v{font-family:var(--mono);font-size:28px;font-weight:700;color:#fff}
.kpi .k{font-size:12px;color:var(--sub);margin-top:4px}
.kpi.g .v{color:var(--green)} .kpi.c .v{color:var(--cyan)} .kpi.gd .v{color:var(--gold)}
.qr-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:20px}
.qr-wrap img{width:172px;height:172px;border-radius:16px;border:3px solid rgba(130,160,230,.5);background:#fff;padding:6px;box-shadow:0 0 40px rgba(91,140,255,.3)}
.qr-wrap .cap{font-size:15px;color:var(--sub)}

.slide.active .reveal{animation:rise .75s both}
.slide.active .reveal:nth-child(1){animation-delay:.06s}
.slide.active .reveal:nth-child(2){animation-delay:.15s}
.slide.active .reveal:nth-child(3){animation-delay:.24s}
.slide.active .reveal:nth-child(4){animation-delay:.33s}
.slide.active .reveal:nth-child(5){animation-delay:.42s}
.slide.active .reveal:nth-child(6){animation-delay:.51s}
.slide.active .reveal:nth-child(7){animation-delay:.6s}
.slide.active .reveal:nth-child(8){animation-delay:.69s}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98);filter:blur(6px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}

#hud{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:16px;background:rgba(10,14,26,.55);border:1px solid var(--line);border-radius:999px;padding:8px 16px;backdrop-filter:blur(14px)}
#hud button{background:none;border:none;color:var(--sub);cursor:pointer;font-size:20px;padding:2px 10px;border-radius:8px;transition:.2s}
#hud button:hover{color:#fff;background:rgba(255,255,255,.1)}
#counter{font-family:var(--mono);font-size:13px;color:var(--sub);min-width:56px;text-align:center}
#progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--cyan),var(--accent),var(--gold));z-index:30;transition:width .6s;box-shadow:0 0 14px rgba(91,140,255,.8)}
.logo-badge{position:fixed;top:20px;left:26px;z-index:20;font-family:var(--mono);font-size:13px;letter-spacing:.15em;color:var(--sub)}
.logo-badge b{color:#fff}
.hint{position:fixed;top:22px;right:26px;z-index:20;font-family:var(--mono);font-size:12px;color:var(--sub);opacity:.65}
@media print{.slide{position:relative;page-break-after:always;opacity:1!important;transform:none!important;width:100%;height:98vh;margin:0 auto}#hud,#progress,.logo-badge,.hint,.aurora,.vignette,#net{display:none}}

/* ===== 移动端适配 ===== */
@media (max-width:640px){
  .slide,.slide *{box-sizing:border-box}
  .slide h1,.slide h2,.slide p,.slide li,.slide .tx,.card h3{overflow-wrap:break-word;word-break:break-word;line-break:auto}
  #stage{align-items:center;padding:0}
  .slide{width:92vw;max-width:92vw;height:auto;max-height:90vh;min-height:auto;padding:28px 20px;border-radius:18px;gap:6px;justify-content:center;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .slide.center{padding:40px 22px}
  .pageno{display:none}
  .kicker{font-size:10px;letter-spacing:.14em;margin-bottom:8px}
  .pageno{font-size:34px;top:20px;right:20px}
  h1{font-size:28px;line-height:1.2;margin-bottom:12px;text-wrap:balance}
  h2{font-size:22px;line-height:1.22;margin-bottom:12px;text-wrap:balance}
  .lead{font-size:15px;line-height:1.6}
  .sm{font-size:12.5px}
  .quote{font-size:14px;padding:11px 14px;margin-top:12px}
  ul.feat{gap:10px}
  ul.feat li{font-size:15px;padding-left:24px;line-height:1.45}
  ul.feat li::before{width:11px;height:11px;top:6px}
  /* 所有多列卡片一律塌成单列 */
  .cards{grid-template-columns:1fr!important;gap:10px}
  /* 例外: 行业行保持 2 列, 更紧凑 */
  .cards-2col-mobile{grid-template-columns:1fr 1fr!important;gap:8px}
  .cards-2col-mobile .card{padding:10px 11px}
  .cards-2col-mobile .card h3{font-size:14px;margin-bottom:4px}
  .cards-2col-mobile .card p{font-size:11.5px;line-height:1.4}
  .card{padding:14px 15px;border-radius:12px}
  .card .num-ic{font-size:19px;margin-bottom:6px}
  .card .ic{font-size:22px;margin-bottom:6px}
  .card h3{font-size:16px;margin-bottom:5px}
  .card p{font-size:13px;line-height:1.5}
  .two{grid-template-columns:1fr!important;gap:12px}
  .metrics{grid-template-columns:1fr!important;gap:10px}
  .metric{padding:16px}
  .metric .num{font-size:34px}
  .steps{flex-direction:column;gap:10px}
  .stage-row{gap:9px}
  .stage-item{padding:12px 14px;gap:11px}
  .stage-item .em{font-size:19px}
  .stage-item .tx{font-size:13.5px;line-height:1.5}
  .console{padding:14px 15px}
  .kpis{grid-template-columns:repeat(3,1fr);gap:8px}
  .kpi{padding:9px}
  .kpi .v{font-size:16px}
  .kpi .k{font-size:10px}
  .big-final{font-size:26px}
  .pill{font-size:13px;padding:8px 13px}
  .dot-list{gap:8px}
  /* 表格：允许横向滚动，避免挤压 */
  /* 手机端: 隐藏横表, 显示堆叠卡片 */
  table.road{display:none}
  .road-hint{display:none!important}
  .road-stack{display:flex!important;flex-direction:column;gap:12px;margin-top:6px}
  .logo-badge{font-size:10px;top:14px;left:16px}
  .hint{display:none}
  #hud{bottom:14px;padding:6px 12px;gap:12px}
  #hud button{font-size:22px}
}
</style>
</head>
<body>
<canvas id="net"></canvas>
<div class="aurora"><span class="s1"></span><span class="s2"></span><span class="s3"></span></div>
<div class="vignette"></div>
<div id="progress"></div>
<div class="logo-badge">RENLAB · <b>境瞳科技</b></div>
<div class="hint">← → 翻页 · F 全屏 · P 打印/PDF</div>
<div id="stage"></div>
<div id="hud"><button id="prev">‹</button><span id="counter">01 / 18</span><button id="next">›</button></div>

<script>
(function(){
  const c=document.getElementById('net'),x=c.getContext('2d');
  let W,H,DPR=Math.min(devicePixelRatio||1,2),pts=[],mouse={x:-999,y:-999};
  function resize(){W=c.width=innerWidth*DPR;H=c.height=innerHeight*DPR;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';
    const n=Math.min(120,Math.floor(innerWidth*innerHeight/14000));pts=[];
    for(let i=0;i<n;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.28*DPR,vy:(Math.random()-.5)*.28*DPR,r:(Math.random()*1.6+.6)*DPR,p:Math.random()*Math.PI*2});}
  addEventListener('resize',resize);resize();
  addEventListener('mousemove',e=>{mouse.x=e.clientX*DPR;mouse.y=e.clientY*DPR});
  const LINK=140*DPR;let t=0;
  function loop(){t+=.016;x.clearRect(0,0,W,H);
    for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      const dx=p.x-mouse.x,dy=p.y-mouse.y,d=Math.hypot(dx,dy);if(d<180*DPR){p.x+=dx/d*1.1;p.y+=dy/d*1.1;}}
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);
      if(d<LINK){const o=(1-d/LINK)*.5;x.strokeStyle='rgba(90,150,255,'+o.toFixed(3)+')';x.lineWidth=DPR*.6;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();}}
    for(const p of pts){const pulse=(Math.sin(t*1.4+p.p)*.5+.5);const r=p.r*(1+pulse*.5);const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,r*4);
      g.addColorStop(0,'rgba(120,180,255,'+(.5+pulse*.4)+')');g.addColorStop(1,'rgba(120,180,255,0)');x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,r*4,0,7);x.fill();
      x.fillStyle='rgba(190,220,255,.9)';x.beginPath();x.arc(p.x,p.y,r,0,7);x.fill();}
    requestAnimationFrame(loop);}loop();
})();

const slides = [
/*1*/`<div class="slide center">
  <div class="kicker reveal">AI FRONTIER LAB · SOCIAL WORLD MODEL</div>
  <h1 class="reveal">让新品、定价、投放、政策等重要决策<br>先在「虚拟社会」里跑一遍</h1>
  <p class="lead reveal">境瞳科技 Renlab · 决策模拟推演</p>
  <div class="dot-list reveal" style="justify-content:center;margin-top:22px">
    <span class="pill">中国人民大学信息学院孵化</span><span class="pill">英诺天使投资</span>
  </div>
</div>`,
/*2*/`<div class="slide"><div class="pageno">01</div>
  <div class="kicker reveal">WHO WE ARE</div>
  <h2 class="reveal">一支从顶尖实验室走出的 <span class="hl">AI Frontier Lab</span></h2>
  <ul class="feat">

const stage=document.getElementById('stage');
slides.forEach((h)=>{const d=document.createElement('div');d.innerHTML=h;stage.appendChild(d.firstElementChild);});
const els=[...document.querySelectorAll('.slide')];
let cur=0;const counter=document.getElementById('counter'),prog=document.getElementById('progress');
function show(n){n=Math.max(0,Math.min(els.length-1,n));
  els.forEach((s,i)=>{s.classList.remove('active','exit-up');if(i<n)s.classList.add('exit-up');});
  els[n].classList.add('active');cur=n;
  counter.textContent=String(n+1).padStart(2,'0')+' / '+String(els.length).padStart(2,'0');
  prog.style.width=(n/(els.length-1)*100)+'%';}
function next(){show(cur+1)}function prev(){show(cur-1)}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next()}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  else if(e.key==='p'||e.key==='P'){window.print()}
  else if(e.key==='Home')show(0);else if(e.key==='End')show(els.length-1);});
let sx=0;document.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)dx<0?next():prev()},{passive:true});
show(0);
(function(){const m=location.search.match(/shot=(\d+)/);if(m){document.querySelectorAll('.reveal').forEach(e=>e.style.animation='none');const st=document.createElement('style');st.textContent='.reveal{opacity:1!important;transform:none!important;filter:none!important}';document.head.appendChild(st);show(+m[1]);}})();
</script>
